<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PT實習通 — 豐原醫院復健科</title>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --teal:#0E7C7B;--teal-light:#1AA0A0;--teal-dark:#075E5E;
  --cream:#F7F4EF;--warm:#FDFCFA;--charcoal:#1C2B2B;
  --slate:#3D5555;--muted:#7A9090;
  --accent:#E8A04A;--border:rgba(14,124,123,0.13);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
body{font-family:'M PLUS Rounded 1c', sans-serif;background:var(--cream);color:var(--charcoal);min-height:100vh;display:flex;flex-direction:column;}

/* BG */
.bg-pattern{position:fixed;inset:0;z-index:0;
  background:radial-gradient(ellipse 60% 60% at 80% 30%,rgba(14,124,123,0.07) 0%,transparent 70%),
  radial-gradient(ellipse 40% 40% at 20% 80%,rgba(232,160,74,0.05) 0%,transparent 60%);
}
.bg-grid{position:fixed;inset:0;z-index:0;
  background-image:linear-gradient(var(--border) 1px,transparent 1px),linear-gradient(90deg,var(--border) 1px,transparent 1px);
  background-size:60px 60px;
  mask-image:radial-gradient(ellipse at center,rgba(0,0,0,0.2) 0%,transparent 70%);
}

/* NAV */
nav{position:relative;z-index:10;padding:0 48px;height:60px;display:flex;align-items:center;justify-content:space-between;background:rgba(253,252,250,0.9);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);}
.nav-logo{display:flex;align-items:center;gap:10px;text-decoration:none;}
.nav-logo-icon{width:34px;height:34px;background:var(--teal);border-radius:9px;display:flex;align-items:center;justify-content:center;color:white;font-weight:900;font-size:14px;font-family:'M PLUS Rounded 1c', sans-serif;}
.nav-logo-text{font-family:'M PLUS Rounded 1c', sans-serif;font-weight:900;font-size:16px;color:var(--charcoal);letter-spacing:2px;}
.nav-info{font-size:12px;color:var(--muted);}

/* MAIN */
main{flex:1;display:flex;align-items:center;justify-content:center;padding:40px 24px;position:relative;z-index:1;}

.login-wrap{width:100%;max-width:440px;}

.login-header{text-align:center;margin-bottom:36px;}
.login-eyebrow{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;background:rgba(14,124,123,0.08);border:1px solid rgba(14,124,123,0.2);border-radius:100px;font-size:11px;font-weight:700;color:var(--teal);letter-spacing:1px;text-transform:uppercase;margin-bottom:16px;}
.login-dot{width:5px;height:5px;border-radius:50%;background:var(--teal);animation:pulse 2s infinite;}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1);}50%{opacity:.5;transform:scale(.8);}}
.login-title{font-family:'M PLUS Rounded 1c', sans-serif;font-weight:900;font-size:28px;color:var(--charcoal);line-height:1.3;margin-bottom:8px;}
.login-sub{font-size:14px;color:var(--muted);line-height:1.7;}

/* ROLE CARDS */
.role-cards{display:flex;flex-direction:column;gap:12px;margin-bottom:20px;}
.role-card{background:white;border:1.5px solid var(--border);border-radius:16px;padding:20px 22px;display:flex;align-items:center;gap:16px;cursor:pointer;transition:all .2s;text-decoration:none;}
.role-card:hover{border-color:var(--teal);box-shadow:0 4px 20px rgba(14,124,123,0.12);transform:translateY(-2px);}
.role-card.supervisor:hover{border-color:var(--teal);}
.role-card.student:hover{border-color:#6B4FA0;}
.role-icon{width:48px;height:48px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;}
.role-card.supervisor .role-icon{background:rgba(14,124,123,0.1);}
.role-card.student .role-icon{background:rgba(107,79,160,0.1);}
.role-info{flex:1;}
.role-name{font-weight:700;font-size:15px;color:var(--charcoal);}
.role-desc{font-size:12px;color:var(--muted);margin-top:3px;}
.role-arrow{font-size:18px;color:var(--muted);transition:transform .2s;}
.role-card:hover .role-arrow{transform:translateX(4px);color:var(--teal);}
.role-card.student:hover .role-arrow{color:#6B4FA0;}

/* ID INPUT */
.id-section{background:white;border:1.5px solid var(--border);border-radius:16px;padding:20px 22px;}
.id-title{font-size:13px;font-weight:700;color:var(--charcoal);margin-bottom:14px;display:flex;align-items:center;gap:6px;}
.id-input-wrap{display:flex;gap:10px;}
.id-input{flex:1;padding:10px 14px;border:1.5px solid var(--border);border-radius:9px;font-size:14px;font-family:inherit;color:var(--charcoal);background:var(--cream);transition:border-color .18s;}
.id-input:focus{outline:none;border-color:var(--teal);background:white;}
.id-btn{padding:10px 20px;background:var(--teal);color:white;border:none;border-radius:9px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;transition:background .18s;white-space:nowrap;}
.id-btn:hover{background:var(--teal-dark);}

.id-hint{font-size:11px;color:var(--muted);margin-top:10px;line-height:1.6;}

/* DIVIDER */
.divider{display:flex;align-items:center;gap:12px;margin:16px 0;}
.divider-line{flex:1;height:1px;background:var(--border);}
.divider-text{font-size:11px;color:var(--muted);white-space:nowrap;}

/* DEMO NOTICE */
.demo-notice{background:rgba(232,160,74,0.1);border:1px solid rgba(232,160,74,0.3);border-radius:10px;padding:12px 16px;font-size:12px;color:#8a5a10;line-height:1.6;margin-top:16px;}
.demo-notice strong{font-weight:700;}

/* FOOTER */
footer{position:relative;z-index:1;padding:20px 48px;border-top:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;background:rgba(253,252,250,0.9);}
.footer-copy{font-size:12px;color:var(--muted);}
.footer-version{font-size:11px;color:var(--muted);background:var(--cream);padding:3px 10px;border-radius:100px;border:1px solid var(--border);}

/* ERROR */
.error-msg{font-size:12px;color:#D0575A;margin-top:8px;display:none;}
.error-msg.show{display:block;}

@media(max-width:480px){
  nav{padding:0 20px;}
  footer{padding:16px 20px;flex-direction:column;gap:8px;text-align:center;}
}
</style>
</head>
<body>

<div class="bg-pattern"></div>
<div class="bg-grid"></div>

<nav>
  <a class="nav-logo" href="#">
    <div class="nav-logo-icon">PT</div>
    <span class="nav-logo-text">實習通</span>
  </a>
  <span class="nav-info">復健科臨床實習管理平台</span>
</nav>

<main>
  <div class="login-wrap">
    <div class="login-header">
      <div class="login-eyebrow">
        <span class="login-dot"></span>
        臨床實習數位管理平台
      </div>
      <h1 class="login-title">歡迎使用<br>PT實習通</h1>
      <p class="login-sub">請選擇您的身份，輸入學號或員工編號後進入系統</p>
    </div>

    <!-- ROLE SELECTION -->
    <div class="role-cards">
      <a class="role-card supervisor" href="#" onclick="selectRole('supervisor')">
        <div class="role-icon">👩‍⚕️</div>
        <div class="role-info">
          <div class="role-name">臨床指導老師</div>
          <div class="role-desc">填寫評核表單 · 審核請假 · 查看學員進度</div>
        </div>
        <span class="role-arrow">›</span>
      </a>
      <a class="role-card student" href="#" onclick="selectRole('student')">
        <div class="role-icon">🎓</div>
        <div class="role-info">
          <div class="role-name">實習學員</div>
          <div class="role-desc">填寫心得 · 技術內容 · 查看學習護照</div>
        </div>
        <span class="role-arrow">›</span>
      </a>
    </div>

    <div class="divider">
      <div class="divider-line"></div>
      <span class="divider-text">輸入編號進入</span>
      <div class="divider-line"></div>
    </div>

    <!-- ID INPUT -->
    <div class="id-section">
      <div class="id-title">🔑 請輸入您的編號</div>
      <div class="id-input-wrap">
        <input class="id-input" type="email" id="idInput" placeholder="您的 Gmail（例：name@gmail.com）">
        <button class="id-btn" onclick="login()">進入系統</button>
      </div>
      <div class="error-msg" id="errorMsg">⚠ 找不到此 Gmail，請確認後重新輸入</div>
      <div class="id-hint">
        · 請輸入您登記的 Gmail<br>
        · 尚未登記請聯繫實習負責人<br>
        · 登入後資料自動同步至系統
      </div>
    </div>

  </div>
</main>

<footer>
  <span class="footer-copy">© 2026 PT實習通</span>
  <span class="footer-version">v1.0</span>
</footer>

<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbzNfhZKb3aPIanHTyBKMRzQ9t1U2g7tRysm3o8HACHzTkAGfB64kCXfp-K854YfG9ew/exec';
let selectedRole = null;

function selectRole(role) {
  selectedRole = role;
  document.querySelectorAll('.role-card').forEach(c => {
    c.style.borderWidth = '1.5px';
    c.style.borderColor = '';
  });
  const card = document.querySelector(`.role-card.${role}`);
  card.style.borderColor = role === 'supervisor' ? 'var(--teal)' : '#6B4FA0';
  card.style.borderWidth = '2px';
  document.getElementById('idInput').focus();
  event.preventDefault();
}

function login() {
  const gmail = document.getElementById('idInput').value.trim().toLowerCase();
  const err = document.getElementById('errorMsg');

  if(!gmail) {
    err.textContent = '⚠ 請輸入您的 Gmail';
    err.classList.add('show');
    return;
  }

  if(!gmail.includes('@')) {
    err.textContent = '⚠ 請輸入完整的 Gmail（例：name@gmail.com）';
    err.classList.add('show');
    return;
  }

  if(!selectedRole) {
    err.textContent = '⚠ 請先選擇身份（督導或學員）';
    err.classList.add('show');
    return;
  }

  // Show loading
  const btn = document.querySelector('.id-btn');
  btn.textContent = '驗證中…';
  btn.disabled = true;
  err.classList.remove('show');

  // Verify with Google Sheets
  const url = `${API_URL}?action=login&data=${encodeURIComponent(JSON.stringify({
    gmail,
    type: selectedRole === 'supervisor' ? 'supervisor' : 'student'
  }))}&callback=handleLogin`;

  const script = document.createElement('script');
  script.src = url;
  document.head.appendChild(script);

  // Timeout fallback
  setTimeout(() => {
    if(btn.disabled) {
      btn.textContent = '進入系統';
      btn.disabled = false;
      err.textContent = '⚠ 連線逾時，請再試一次';
      err.classList.add('show');
    }
  }, 10000);
}

function handleLogin(result) {
  const btn = document.querySelector('.id-btn');
  const err = document.getElementById('errorMsg');
  btn.textContent = '進入系統';
  btn.disabled = false;

  if(result.success) {
    sessionStorage.setItem('pt-role', result.role);
    sessionStorage.setItem('pt-name', result.name);
    sessionStorage.setItem('pt-gmail', result.gmail);
    if(result.currentStation) {
      sessionStorage.setItem('pt-station', result.currentStation);
    }
    if(result.level) {
      sessionStorage.setItem('pt-level', result.level);
    }
    window.location.href = result.role === 'supervisor' ? 'supervisor.html' : 'student.html';
  } else {
    err.textContent = '⚠ ' + result.message;
    err.classList.add('show');
  }
}

document.getElementById('idInput').addEventListener('keypress', e => {
  if(e.key === 'Enter') login();
});
</script>
</body>
</html>
